<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remix PRIME</title>
  <meta name="description" content="Personal operating system for total self-mastery: workout, nutrition, habits, time-blocking, body tracking, and PRIME score." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">Remix <span>PRIME</span></div>
      <div class="score-pill" id="scorePill">
        <span class="score-num" id="scoreNum">0</span>
        <span class="score-label">PRIME SCORE</span>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <div class="container tabs-inner" id="tabs">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="workout">Workout</button>
      <button class="tab" data-tab="nutrition">Nutrition</button>
      <button class="tab" data-tab="habits">Habits</button>
      <button class="tab" data-tab="planner">Time-Blocking</button>
      <button class="tab" data-tab="body">Body</button>
    </div>
  </nav>

  <main class="container view" id="view"></main>

  <footer class="footer">
    <div class="container">
      <p>Remix PRIME &middot; all data stays on this device (localStorage)</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>

name: Build Android App Bundle & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK & Release Bundle
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-Release-Bundle
          path: app/build/outputs/bundle/release/*.aab
